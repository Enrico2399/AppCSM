<div class="install-banner" *ngIf="visible" role="dialog" aria-live="polite" [attr.aria-label]="'installPrompt.ariaLabel' | translate">
  <button type="button" class="install-close" (click)="dismiss()" [attr.aria-label]="'installPrompt.closeAria' | translate">✕</button>

  <div class="install-icon" aria-hidden="true">📲</div>

  <div class="install-text">
    <strong>{{ 'installPrompt.title' | translate }}</strong>

    <p *ngIf="platform === 'android'">
      {{ 'installPrompt.androidBody' | translate }}
    </p>

    <p *ngIf="platform === 'ios'">
      {{ 'installPrompt.iosBody1' | translate }} <strong>{{ 'installPrompt.share' | translate }}</strong> <span aria-hidden="true">⬆️</span> {{ 'installPrompt.iosBody2' | translate }}
      <strong>{{ 'installPrompt.addToHome' | translate }}</strong>.
    </p>
  </div>

  <div class="install-actions">
    <button *ngIf="platform === 'android'" type="button" class="install-btn" (click)="install()">
      {{ 'installPrompt.install' | translate }}
    </button>
    <button type="button" class="dismiss-btn" (click)="dismiss()">
      {{ 'installPrompt.notNow' | translate }}
    </button>
  </div>
</div>
