<div class="install-banner" *ngIf="visible" role="dialog" aria-live="polite" aria-label="Installa CSM Digitale">
  <button type="button" class="install-close" (click)="dismiss()" aria-label="Chiudi, non ora">✕</button>

  <div class="install-icon" aria-hidden="true">📲</div>

  <div class="install-text">
    <strong>Installa CSM sul tuo dispositivo</strong>

    <p *ngIf="platform === 'android'">
      Usala come un'app vera: si apre con un'icona sulla home e funziona anche offline.
    </p>

    <p *ngIf="platform === 'ios'">
      Tocca <strong>Condividi</strong> <span aria-hidden="true">⬆️</span> nella barra di Safari, poi
      <strong>"Aggiungi alla schermata Home"</strong>.
    </p>
  </div>

  <div class="install-actions">
    <button *ngIf="platform === 'android'" type="button" class="install-btn" (click)="install()">
      Installa
    </button>
    <button type="button" class="dismiss-btn" (click)="dismiss()">
      Non ora
    </button>
  </div>
</div>
